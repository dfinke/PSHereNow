<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline Portfolio Grid</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabulator/6.3.1/css/tabulator.min.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #17211d;
      --muted: #63706a;
      --line: #d9e1dc;
      --surface: #ffffff;
      --wash: #eef3ef;
      --accent: #116a5c;
      --accent-strong: #0a4e44;
      --warning: #a35f00;
      --danger: #b73838;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--wash);
      color: var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(238, 243, 239, 0.96)),
        radial-gradient(circle at 15% 0%, rgba(17, 106, 92, 0.12), transparent 28%),
        var(--wash);
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .lede {
      max-width: 62ch;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    button,
    input,
    select {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      border-color: var(--line);
      background: var(--surface);
      color: var(--ink);
    }

    button:hover {
      background: var(--accent-strong);
    }

    button.secondary:hover {
      background: #f5f8f6;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .metric {
      min-height: 88px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
    }

    .metric span {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .metric strong {
      font-size: clamp(1.45rem, 3vw, 2.15rem);
      line-height: 1;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 190px 170px auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    .toolbar input,
    .toolbar select {
      width: 100%;
      padding: 0 12px;
    }

    #portfolio-grid {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .tabulator {
      border: 0;
      background: var(--surface);
      font-size: 0.93rem;
    }

    .tabulator .tabulator-header {
      border-bottom-color: var(--line);
      background: #f6f9f7;
      color: var(--ink);
      font-weight: 800;
    }

    .tabulator .tabulator-row {
      border-bottom-color: #edf2ee;
    }

    .tabulator .tabulator-row.tabulator-row-even {
      background: #fbfcfb;
    }

    .status {
      display: inline-flex;
      min-width: 88px;
      justify-content: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-active {
      background: #dff3ec;
      color: #0d594d;
    }

    .status-review {
      background: #fff1d6;
      color: var(--warning);
    }

    .status-risk {
      background: #ffe1df;
      color: var(--danger);
    }

    .status-done {
      background: #e6ebf4;
      color: #364760;
    }

    .confidence {
      display: grid;
      grid-template-columns: 1fr 46px;
      gap: 10px;
      align-items: center;
      width: 100%;
    }

    .confidence-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #e2e9e5;
    }

    .confidence-bar {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .confidence-low .confidence-bar {
      background: var(--danger);
    }

    .confidence-mid .confidence-bar {
      background: var(--warning);
    }

    .confidence-value {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      text-align: right;
    }

    @media (max-width: 820px) {
      header {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-start;
      }

      .metrics,
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .toolbar button {
        justify-content: center;
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100vw - 20px, 1180px);
        padding: 20px 0;
      }

      .metrics,
      .toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Pipeline Portfolio</h1>
        <p class="lede">CSV data is embedded in this HTML file and rendered with the MIT licensed Tabulator grid.</p>
      </div>
      <div class="actions">
        <button type="button" id="download-csv">Download CSV</button>
        <button type="button" id="download-json" class="secondary">Download JSON</button>
      </div>
    </header>

    <section class="metrics" aria-label="Portfolio metrics">
      <div class="metric">
        <span>Projects</span>
        <strong id="metric-projects">0</strong>
      </div>
      <div class="metric">
        <span>Weighted Value</span>
        <strong id="metric-weighted">$0</strong>
      </div>
      <div class="metric">
        <span>Avg Confidence</span>
        <strong id="metric-confidence">0%</strong>
      </div>
      <div class="metric">
        <span>At Risk</span>
        <strong id="metric-risk">0</strong>
      </div>
    </section>

    <section class="toolbar" aria-label="Grid filters">
      <input id="quick-filter" type="search" placeholder="Search projects, owners, regions">
      <select id="status-filter">
        <option value="">All statuses</option>
      </select>
      <select id="region-filter">
        <option value="">All regions</option>
      </select>
      <button type="button" id="clear-filters" class="secondary">Clear</button>
    </section>

    <div id="portfolio-grid"></div>
  </main>

  <script id="portfolio-csv" type="text/csv">
Project,Owner,Region,Status,Priority,Launch,Spend,Value,Confidence
Agent Assist Rollout,Maya Chen,North America,Active,High,2026-06-14,185000,420000,0.78
Customer Health Signals,Theo Martin,Europe,Review,Medium,2026-07-02,96000,240000,0.64
Renewal Workflow Tuneup,Sofia Rao,North America,Active,Medium,2026-05-28,72000,155000,0.82
Field Ops Mobile Kit,Eli Turner,APAC,Risk,High,2026-08-19,210000,510000,0.47
Revenue Desk Cleanup,Nora Patel,Europe,Done,Low,2026-04-30,38000,90000,0.91
Partner Portal Refresh,Jon Bell,Latin America,Active,Medium,2026-07-25,128000,310000,0.69
Quote Quality Scanner,Imani Cole,North America,Review,High,2026-06-30,154000,360000,0.58
Knowledge Base Merge,Arun Singh,APAC,Done,Medium,2026-05-09,64000,140000,0.87
Churn Save Playbooks,Lena Torres,Latin America,Risk,High,2026-09-03,142000,330000,0.44
Usage Metering Audit,Grace Kim,Europe,Active,Low,2026-06-18,52000,115000,0.76
Pipeline Hygiene Sprint,Marcus Reed,North America,Done,Low,2026-05-16,27000,68000,0.93
Expansion Signal Lab,Priya Shah,APAC,Review,Medium,2026-08-07,116000,275000,0.61
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tabulator/6.3.1/js/tabulator.min.js"></script>
  <script>
    const csvText = document.getElementById("portfolio-csv").textContent.trim();

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        const next = text[index + 1];

        if (char === '"' && inQuotes && next === '"') {
          cell += '"';
          index += 1;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === "," && !inQuotes) {
          row.push(cell);
          cell = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") {
            index += 1;
          }

          row.push(cell);
          if (row.some((value) => value.trim() !== "")) {
            rows.push(row);
          }

          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      row.push(cell);
      if (row.some((value) => value.trim() !== "")) {
        rows.push(row);
      }

      const headers = rows.shift();
      return rows.map((values) => Object.fromEntries(headers.map((header, index) => {
        const value = values[index] ?? "";
        if (["Spend", "Value"].includes(header)) {
          return [header, Number(value)];
        }

        if (header === "Confidence") {
          return [header, Number(value)];
        }

        return [header, value];
      })));
    }

    const sourceRows = parseCsv(csvText);
    const currency = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 0,
    });

    const percent = new Intl.NumberFormat("en-US", {
      style: "percent",
      maximumFractionDigits: 0,
    });

    function statusFormatter(cell) {
      const value = cell.getValue();
      const className = value.toLowerCase();
      return `<span class="status status-${className}">${value}</span>`;
    }

    function confidenceFormatter(cell) {
      const value = cell.getValue();
      const tone = value < 0.55 ? "confidence-low" : value < 0.7 ? "confidence-mid" : "";
      return `
        <div class="confidence ${tone}">
          <div class="confidence-track"><div class="confidence-bar" style="width: ${value * 100}%"></div></div>
          <span class="confidence-value">${percent.format(value)}</span>
        </div>
      `;
    }

    const table = new Tabulator("#portfolio-grid", {
      data: sourceRows,
      layout: "fitColumns",
      height: "560px",
      pagination: true,
      paginationSize: 8,
      movableColumns: true,
      initialSort: [
        { column: "Priority", dir: "asc" },
        { column: "Launch", dir: "asc" },
      ],
      columns: [
        { title: "Project", field: "Project", minWidth: 220, frozen: true, headerFilter: "input" },
        { title: "Owner", field: "Owner", width: 150, headerFilter: "input" },
        { title: "Region", field: "Region", width: 150, headerFilter: "list", headerFilterParams: { valuesLookup: true, clearable: true } },
        { title: "Status", field: "Status", width: 120, formatter: statusFormatter, headerFilter: "list", headerFilterParams: { valuesLookup: true, clearable: true } },
        { title: "Priority", field: "Priority", width: 110 },
        { title: "Launch", field: "Launch", width: 130, sorter: "date" },
        { title: "Spend", field: "Spend", width: 130, hozAlign: "right", formatter: "money", formatterParams: { precision: false, symbol: "$" }, bottomCalc: "sum", bottomCalcFormatter: "money", bottomCalcFormatterParams: { precision: false, symbol: "$" } },
        { title: "Value", field: "Value", width: 130, hozAlign: "right", formatter: "money", formatterParams: { precision: false, symbol: "$" }, bottomCalc: "sum", bottomCalcFormatter: "money", bottomCalcFormatterParams: { precision: false, symbol: "$" } },
        { title: "Confidence", field: "Confidence", width: 160, formatter: confidenceFormatter, sorter: "number" },
      ],
    });

    const quickFilter = document.getElementById("quick-filter");
    const statusFilter = document.getElementById("status-filter");
    const regionFilter = document.getElementById("region-filter");

    function populateFilter(select, field) {
      const values = [...new Set(sourceRows.map((row) => row[field]))].sort();
      for (const value of values) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.append(option);
      }
    }

    populateFilter(statusFilter, "Status");
    populateFilter(regionFilter, "Region");

    function applyFilters() {
      const term = quickFilter.value.trim().toLowerCase();
      const status = statusFilter.value;
      const region = regionFilter.value;

      table.setFilter((row) => {
        const matchesTerm = !term || ["Project", "Owner", "Region", "Status", "Priority"].some((field) =>
          String(row[field]).toLowerCase().includes(term)
        );
        const matchesStatus = !status || row.Status === status;
        const matchesRegion = !region || row.Region === region;
        return matchesTerm && matchesStatus && matchesRegion;
      });
    }

    function visibleRows() {
      return table.getData("active");
    }

    function updateMetrics() {
      const rows = visibleRows();
      const weighted = rows.reduce((sum, row) => sum + (row.Value * row.Confidence), 0);
      const confidence = rows.length ? rows.reduce((sum, row) => sum + row.Confidence, 0) / rows.length : 0;
      const risk = rows.filter((row) => row.Status === "Risk").length;

      document.getElementById("metric-projects").textContent = rows.length;
      document.getElementById("metric-weighted").textContent = currency.format(weighted);
      document.getElementById("metric-confidence").textContent = percent.format(confidence);
      document.getElementById("metric-risk").textContent = risk;
    }

    quickFilter.addEventListener("input", applyFilters);
    statusFilter.addEventListener("change", applyFilters);
    regionFilter.addEventListener("change", applyFilters);

    document.getElementById("clear-filters").addEventListener("click", () => {
      quickFilter.value = "";
      statusFilter.value = "";
      regionFilter.value = "";
      table.clearFilter(true);
    });

    document.getElementById("download-csv").addEventListener("click", () => {
      table.download("csv", "pipeline-portfolio.csv");
    });

    document.getElementById("download-json").addEventListener("click", () => {
      table.download("json", "pipeline-portfolio.json");
    });

    table.on("dataFiltered", updateMetrics);
    table.on("tableBuilt", updateMetrics);
    requestAnimationFrame(updateMetrics);
  </script>
</body>
</html>
